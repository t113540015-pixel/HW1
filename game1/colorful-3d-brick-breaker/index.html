<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful 3D Brick Breaker</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <main>
        <h1>Colorful 3D Brick Breaker</h1>
        <p>Use the arrow keys or mouse to control the paddle. Break all the bricks to win!</p>
        <canvas id="gameCanvas" width="800" height="600" aria-label="Colorful 3D Brick Breaker Game"></canvas>
        <p id="status">Score: 0</p>
        <button id="restartButton">Restart Game</button>
    </main>
    <script src="src/game.js"></script>
</body>
</html>
