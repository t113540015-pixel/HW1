<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄羅斯方塊 Tetris</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #26365c 0%, #111827 45%, #080b12 100%);
    color: white;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-wrapper {
    display: flex;
    gap: 25px;
    align-items: flex-start;
    padding: 25px;
}

.panel {
    width: 180px;
}

.title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.subtitle {
    color: #aab6d3;
    font-size: 13px;
    margin-bottom: 25px;
}

.info-box {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.info-label {
    color: #8f9bb8;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-value {
    font-size: 25px;
    font-weight: bold;
}

#nextCanvas {
    width: 150px;
    height: 110px;
    display: block;
    margin: auto;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 11px;
    margin-top: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    background: #34446b;
    color: white;
    transition: 0.15s;
}

button:hover {
    background: #465b8c;
    transform: translateY(-1px);
}

.primary {
    background: #667eea;
}

.primary:hover {
    background: #7b8ef0;
}

.game-container {
    position: relative;
}

#gameCanvas {
    width: 300px;
    height: 600px;
    display: block;
    background: #0a0e18;
    border: 3px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 40px rgba(102,126,234,0.12);
}

.overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(5,8,15,0.82);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    backdrop-filter: blur(5px);
}

.overlay.hidden {
    display: none;
}

.overlay h2 {
    font-size: 32px;
    margin: 0 0 10px;
}

.overlay p {
    color: #aeb8d0;
    margin-bottom: 20px;
}

.controls {
    margin-top: 20px;
    color: #9da8c0;
    font-size: 12px;
    line-height: 1.8;
}

.mobile-controls {
    display: none;
    margin-top: 15px;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.mobile-controls button {
    margin: 0;
    font-size: 18px;
    padding: 12px 5px;
}

.mobile-controls .wide {
    grid-column: span 3;
}

@media (max-width: 700px) {
    body {
        align-items: flex-start;
    }

    .game-wrapper {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 15px;
    }

    .panel {
        width: 300px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .title,
    .subtitle {
        grid-column: span 2;
        margin: 0;
    }

    .info-box {
        margin: 0;
    }

    .next-box {
        display: none;
    }

    .controls {
        display: none;
    }

    .mobile-controls {
        display: grid;
    }

    #gameCanvas {
        width: 300px;
        height: 600px;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <div class="panel">

        <div class="title">TETRIS</div>
        <div class="subtitle">經典俄羅斯方塊</div>

        <div class="info-box">
            <div class="info-label">SCORE</div>
            <div class="info-value" id="score">0</div>
        </div>

        <div class="info-box">
            <div class="info-label">LEVEL</div>
            <div class="info-value" id="level">1</div>
        </div>

        <div class="info-box">
            <div class="info-label">LINES</div>
            <div class="info-value" id="lines">0</div>
        </div>

        <div class="info-box next-box">
            <div class="info-label">NEXT</div>
            <canvas id="nextCanvas" width="150" height="110"></canvas>
        </div>

        <button class="primary" onclick="restartGame()">重新開始</button>
        <button onclick="togglePause()">⏸ 暫停</button>
        <button onclick="toggleSound()">🔊 音效：開啟</button>

        <div class="controls">
            ← →　移動<br>
            ↑ / X　旋轉<br>
            Z　反向旋轉<br>
            ↓　加速下降<br>
            SPACE　直接落下<br>
            P　暫停
        </div>

    </div>

    <div class="game-container">

        <canvas id="gameCanvas" width="300" height="600"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">TETRIS</h2>
            <p id="overlayText">按任意方向鍵開始遊戲</p>
            <button style="width:160px" onclick="restartGame()">開始遊戲</button>
        </div>

        <div class="mobile-controls">
            <button onclick="rotate()">↻</button>
            <button onclick="hardDrop()">⬇</button>
            <button onclick="rotate(true)">↺</button>

            <button onclick="move(-1)">←</button>
            <button onclick="softDrop()">↓</button>
            <button onclick="move(1)">→</button>

            <button class="wide" onclick="togglePause()">⏸ 暫停</button>
        </div>

    </div>

</div>

<script>

/* =========================
   Canvas
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

const colors = {
    I: "#28d7e8",
    O: "#f5d547",
    T: "#a66cff",
    S: "#55d66b",
    Z: "#ff5c70",
    J: "#5685ff",
    L: "#ff9b42"
};

const shapes = {

    I: [
        [1,1,1,1]
    ],

    O: [
        [1,1],
        [1,1]
    ],

    T: [
        [0,1,0],
        [1,1,1]
    ],

    S: [
        [0,1,1],
        [1,1,0]
    ],

    Z: [
        [1,1,0],
        [0,1,1]
    ],

    J: [
        [1,0,0],
        [1,1,1]
    ],

    L: [
        [0,0,1],
        [1,1,1]
    ]
};


/* =========================
   Game State
========================= */

let board;
let current;
let nextPiece;

let score = 0;
let lines = 0;
let level = 1;

let dropInterval = 800;
let dropCounter = 0;
let lastTime = 0;

let gameStarted = false;
let paused = false;
let gameOver = false;

let soundEnabled = true;


/* =========================
   Audio System
========================= */

let audioCtx = null;

function initAudio() {

    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function beep(
    frequency,
    duration = 0.08,
    type = "square",
    volume = 0.05
) {

    if (!soundEnabled) return;

    initAudio();

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

function moveSound() {
    beep(180, 0.035, "square", 0.025);
}

function rotateSound() {
    beep(420, 0.06, "square", 0.035);
}

function dropSound() {
    beep(110, 0.07, "triangle", 0.04);
}

function lineSound(count) {

    if (count === 1) {
        beep(520, 0.08, "square", 0.05);
        setTimeout(() => beep(700, 0.1, "square", 0.05), 70);
    }

    else if (count === 2) {
        beep(500, 0.08, "square", 0.05);
        setTimeout(() => beep(650, 0.08, "square", 0.05), 70);
        setTimeout(() => beep(800, 0.12, "square", 0.05), 140);
    }

    else if (count === 3) {
        beep(500, 0.08, "square", 0.05);
        setTimeout(() => beep(650, 0.08, "square", 0.05), 70);
        setTimeout(() => beep(800, 0.08, "square", 0.05), 140);
        setTimeout(() => beep(950, 0.15, "square", 0.06), 210);
    }

    else {
        // Tetris
        beep(500, 0.08, "square", 0.06);
        setTimeout(() => beep(650, 0.08, "square", 0.06), 80);
        setTimeout(() => beep(800, 0.08, "square", 0.06), 160);
        setTimeout(() => beep(1000, 0.2, "square", 0.07), 240);
    }
}

function gameOverSound() {

    beep(400, 0.12, "sawtooth", 0.05);

    setTimeout(() => {
        beep(300, 0.12, "sawtooth", 0.05);
    }, 120);

    setTimeout(() => {
        beep(200, 0.25, "sawtooth", 0.05);
    }, 240);
}

function toggleSound() {

    soundEnabled = !soundEnabled;

    const button =
        document.querySelectorAll(".panel button")[2];

    button.textContent =
        soundEnabled
        ? "🔊 音效：開啟"
        : "🔇 音效：關閉";

    if (soundEnabled) {
        beep(600, 0.08);
    }
}


/* =========================
   Board
========================= */

function createBoard() {

    return Array.from(
        {length: ROWS},
        () => Array(COLS).fill(null)
    );
}

function randomPiece() {

    const keys = Object.keys(shapes);
    const type =
        keys[Math.floor(Math.random() * keys.length)];

    return {
        type,
        shape: shapes[type].map(row => [...row]),
        x: 0,
        y: 0
    };
}

function resetPiece() {

    current = nextPiece || randomPiece();
    nextPiece = randomPiece();

    current.y = 0;
    current.x =
        Math.floor(
            (COLS - current.shape[0].length) / 2
        );

    drawNext();

    if (collision()) {
        endGame();
    }
}


/* =========================
   Collision
========================= */

function collision(piece = current) {

    for (let y = 0; y < piece.shape.length; y++) {

        for (let x = 0; x < piece.shape[y].length; x++) {

            if (!piece.shape[y][x]) continue;

            const bx = piece.x + x;
            const by = piece.y + y;

            if (
                bx < 0 ||
                bx >= COLS ||
                by >= ROWS
            ) {
                return true;
            }

            if (by >= 0 && board[by][bx]) {
                return true;
            }
        }
    }

    return false;
}


/* =========================
   Merge
========================= */

function merge() {

    current.shape.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value) {

                if (
                    current.y + y >= 0 &&
                    current.y + y < ROWS
                ) {
                    board[current.y + y]
                        [current.x + x] =
                        current.type;
                }
            }
        });
    });

    dropSound();

    clearLines();
    resetPiece();
}


/* =========================
   Clear Lines
========================= */

function clearLines() {

    let cleared = 0;

    outer:
    for (let y = ROWS - 1; y >= 0; y--) {

        for (let x = 0; x < COLS; x++) {

            if (!board[y][x]) {
                continue outer;
            }
        }

        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));

        cleared++;
        y++;
    }

    if (cleared > 0) {

        lines += cleared;

        const points = [
            0,
            100,
            300,
            500,
            800
        ];

        score += points[cleared] * level;

        level =
            Math.floor(lines / 10) + 1;

        dropInterval =
            Math.max(
                100,
                800 - (level - 1) * 70
            );

        lineSound(cleared);

        updateUI();
    }
}


/* =========================
   Movement
========================= */

function move(direction) {

    if (!gameStarted || paused || gameOver) return;

    initAudio();

    current.x += direction;

    if (collision()) {
        current.x -= direction;
    } else {
        moveSound();
    }

    draw();
}

function softDrop() {

    if (!gameStarted || paused || gameOver) return;

    current.y++;

    if (collision()) {

        current.y--;
        merge();

    } else {

        score += 1;
        updateUI();
    }

    dropCounter = 0;

    draw();
}


/* =========================
   Rotation
========================= */

function rotate(reverse = false) {

    if (!gameStarted || paused || gameOver) return;

    initAudio();

    const oldShape =
        current.shape.map(row => [...row]);

    const rows = current.shape.length;
    const cols = current.shape[0].length;

    const rotated =
        Array.from(
            {length: cols},
            () => Array(rows).fill(0)
        );

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            if (reverse) {
                rotated[cols - x - 1][y] =
                    current.shape[y][x];
            } else {
                rotated[x][rows - y - 1] =
                    current.shape[y][x];
            }
        }
    }

    current.shape = rotated;

    const originalX = current.x;

    const kicks = [0, -1, 1, -2, 2];

    let success = false;

    for (const kick of kicks) {

        current.x = originalX + kick;

        if (!collision()) {
            success = true;
            break;
        }
    }

    if (!success) {

        current.shape = oldShape;
        current.x = originalX;

    } else {

        rotateSound();
    }

    draw();
}


/* =========================
   Hard Drop
========================= */

function hardDrop() {

    if (!gameStarted || paused || gameOver) return;

    initAudio();

    let distance = 0;

    while (!collision()) {
        current.y++;
        distance++;
    }

    current.y--;

    score += Math.max(0, distance - 1) * 2;

    merge();

    updateUI();
    draw();
}


/* =========================
   Game Loop
========================= */

function update(time = 0) {

    const deltaTime = time - lastTime;

    lastTime = time;

    if (
        gameStarted &&
        !paused &&
        !gameOver
    ) {

        dropCounter += deltaTime;

        if (dropCounter > dropInterval) {

            current.y++;

            if (collision()) {

                current.y--;
                merge();

            }

            dropCounter = 0;
        }
    }

    draw();

    requestAnimationFrame(update);
}


/* =========================
   Drawing
========================= */

function drawCell(
    context,
    x,
    y,
    color,
    size
) {

    context.fillStyle = color;

    context.fillRect(
        x * size,
        y * size,
        size,
        size
    );

    context.strokeStyle =
        "rgba(255,255,255,0.12)";

    context.lineWidth = 1;

    context.strokeRect(
        x * size + 1,
        y * size + 1,
        size - 2,
        size - 2
    );

    // Highlight
    context.fillStyle =
        "rgba(255,255,255,0.18)";

    context.fillRect(
        x * size + 3,
        y * size + 3,
        size - 6,
        4
    );
}

function drawBoard() {

    ctx.fillStyle = "#0a0e18";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Grid
    ctx.strokeStyle =
        "rgba(255,255,255,0.035)";

    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {

        ctx.beginPath();

        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, canvas.height);

        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {

        ctx.beginPath();

        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(canvas.width, y * BLOCK);

        ctx.stroke();
    }

    // Fixed blocks
    board.forEach((row, y) => {

        row.forEach((type, x) => {

            if (type) {

                drawCell(
                    ctx,
                    x,
                    y,
                    colors[type],
                    BLOCK
                );
            }
        });
    });
}

function drawCurrent() {

    if (!current) return;

    current.shape.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value) {

                drawCell(
                    ctx,
                    current.x + x,
                    current.y + y,
                    colors[current.type],
                    BLOCK
                );
            }
        });
    });
}

function drawGhost() {

    if (!current || gameOver) return;

    let ghostY = current.y;

    while (true) {

        ghostY++;

        const ghost = {
            ...current,
            y: ghostY
        };

        if (collision(ghost)) {
            break;
        }
    }

    ghostY--;

    current.shape.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value) {

                ctx.strokeStyle =
                    "rgba(255,255,255,0.18)";

                ctx.lineWidth = 2;

                ctx.strokeRect(
                    (current.x + x) * BLOCK + 4,
                    (ghostY + y) * BLOCK + 4,
                    BLOCK - 8,
                    BLOCK - 8
                );
            }
        });
    });
}

function draw() {

    drawBoard();
    drawGhost();
    drawCurrent();
}

function drawNext() {

    nextCtx.fillStyle = "#0a0e18";

    nextCtx.fillRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );

    if (!nextPiece) return;

    const size = 25;

    const shape = nextPiece.shape;

    const width = shape[0].length * size;
    const height = shape.length * size;

    const offsetX =
        (nextCanvas.width - width) / 2;

    const offsetY =
        (nextCanvas.height - height) / 2;

    shape.forEach((row, y) => {

        row.forEach((value, x) => {

            if (value) {

                nextCtx.fillStyle =
                    colors[nextPiece.type];

                nextCtx.fillRect(
                    offsetX + x * size,
                    offsetY + y * size,
                    size,
                    size
                );

                nextCtx.strokeStyle =
                    "rgba(255,255,255,0.15)";

                nextCtx.strokeRect(
                    offsetX + x * size,
                    offsetY + y * size,
                    size,
                    size
                );
            }
        });
    });
}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("score")
        .textContent = score.toLocaleString();

    document.getElementById("level")
        .textContent = level;

    document.getElementById("lines")
        .textContent = lines;
}


/* =========================
   Pause
========================= */

function togglePause() {

    if (!gameStarted || gameOver) return;

    paused = !paused;

    const overlay =
        document.getElementById("overlay");

    const title =
        document.getElementById("overlayTitle");

    const text =
        document.getElementById("overlayText");

    if (paused) {

        title.textContent = "PAUSED";
        text.textContent = "遊戲已暫停";
        overlay.classList.remove("hidden");

    } else {

        overlay.classList.add("hidden");
    }
}


/* =========================
   Game Over
========================= */

function endGame() {

    gameOver = true;
    gameStarted = false;

    gameOverSound();

    document.getElementById("overlayTitle")
        .textContent = "GAME OVER";

    document.getElementById("overlayText")
        .textContent =
        `分數：${score.toLocaleString()}　|　消除：${lines} 行`;

    document.getElementById("overlay")
        .classList.remove("hidden");
}


/* =========================
   Restart
========================= */

function restartGame() {

    initAudio();

    board = createBoard();

    score = 0;
    lines = 0;
    level = 1;

    dropInterval = 800;
    dropCounter = 0;

    paused = false;
    gameOver = false;
    gameStarted = true;

    nextPiece = randomPiece();

    resetPiece();

    updateUI();

    document.getElementById("overlay")
        .classList.add("hidden");

    beep(600, 0.08, "square", 0.04);
    setTimeout(() => {
        beep(800, 0.1, "square", 0.04);
    }, 90);
}


/* =========================
   Keyboard
========================= */

document.addEventListener("keydown", event => {

    const key = event.code;

    if (
        [
            "ArrowLeft",
            "ArrowRight",
            "ArrowDown",
            "ArrowUp",
            "Space"
        ].includes(key)
    ) {
        event.preventDefault();
    }

    if (!gameStarted && !gameOver) {
        initAudio();
        gameStarted = true;
        document.getElementById("overlay")
            .classList.add("hidden");
    }

    if (gameOver) return;

    if (key === "ArrowLeft") {
        move(-1);
    }

    else if (key === "ArrowRight") {
        move(1);
    }

    else if (key === "ArrowDown") {
        softDrop();
    }

    else if (key === "ArrowUp" || key === "KeyX") {
        rotate(false);
    }

    else if (key === "KeyZ") {
        rotate(true);
    }

    else if (key === "Space") {
        hardDrop();
    }

    else if (key === "KeyP") {
        togglePause();
    }
});


/* =========================
   Touch / Mobile
========================= */

document.addEventListener(
    "touchstart",
    () => initAudio(),
    {once: true}
);


/* =========================
   Start
========================= */

board = createBoard();

nextPiece = randomPiece();

resetPiece();

updateUI();

requestAnimationFrame(update);

</script>

</body>
</html>
